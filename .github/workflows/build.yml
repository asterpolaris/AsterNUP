name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26   # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcrun swift --version
      - name: Check scripts
        run: for f in scripts/*.sh scripts/lib/*.sh Tests/*.sh; do zsh -n "$f"; done
      - name: Build AsterNUP.app
        run: scripts/make_app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: AsterNUP-app
          path: build/AsterNUP.app
          retention-days: 7
